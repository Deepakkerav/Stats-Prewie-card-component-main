<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Stats preview card component</title>
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <main class="wrapping">
         <div class="business-des">
            <div class="text">
              <h1>Get <span>insights</span> that help your business grow</h1>
               <p>Discover the benefits of data analytics amd make better decision reagarding revenue,customer
                experince, and overall efficiency.
               </p>
            </div>
            <div class="overview">
               <div>
                  <p>10K+</p>
                  <label for="COMPANIES">COMPANIES</label>
               </div>
               <div>
                <p>314</p>
                <label for="TEMPLATE">TEMPLATE</label>
               </div>
               <div>
                <p>12M+</p>
                <label for="Queries">QUERIES</label>
               </div>
            </div>
         </div>
         <div class="business-img">
              
           <div class="one"></div>
         </div>
    </main>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
